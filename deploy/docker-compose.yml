services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/saivikrantg/checkpoint-backend:${BACKEND_TAG}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
      - current-tag.env
    environment:
      CHECKPOINT_PRIMARY.ENV: production
      CHECKPOINT_DATABASE.HOST: postgres
      CHECKPOINT_DATABASE.PORT: '5432'
      CHECKPOINT_DATABASE.USER: ${POSTGRES_USER}
      CHECKPOINT_DATABASE.PASSWORD: ${POSTGRES_PASSWORD}
      CHECKPOINT_DATABASE.NAME: ${POSTGRES_DB}
      CHECKPOINT_SERVER.CORS_ALLOWED_ORIGINS: https://${DOMAIN}

  diun:
    image: crazymax/diun:latest
    restart: unless-stopped
    command: serve
    volumes:
      - diun_data:/data
      - ./diun.yml:/etc/diun/diun.yml:ro
      - ./images.yml:/etc/diun/images.yml:ro
    environment:
      TZ: UTC
      DIUN_REGOPTS_0_NAME: ghcr
      DIUN_REGOPTS_0_SELECTOR: name
      DIUN_REGOPTS_0_USERNAME: saivikrantg
      DIUN_REGOPTS_0_PASSWORD: ${CHECKPOINT_DEPLOY_GHCR_PAT}
      DIUN_NOTIF_WEBHOOK_HEADERS_AUTHORIZATION: ${CHECKPOINT_DEPLOY_WEBHOOK_SECRET}
      DIUN_NOTIF_WEBHOOK_HEADERS_CONTENT-TYPE: application/json
    env_file:
      - .env

  webhook:
    build:
      context: .
      dockerfile: webhook.Dockerfile
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./hooks.json:/etc/webhook/hooks.json:ro
      - .:/deploy
      - ~/.docker/config.json:/root/.docker/config.json:ro
    command: ['-verbose', '-hooks=/etc/webhook/hooks.json', '-template', '-hotreload']
    env_file:
      - .env

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - ../apps/frontend/dist:/srv/frontend:ro
    depends_on:
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  diun_data:
