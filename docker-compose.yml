services:
  # The Database
  db:
    image: postgres:18-alpine
    container_name: checkpoint_postgres
    environment:
      POSTGRES_USER: postgres
      # POSTGRES_PASSWORD: dev_password
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: checkpoint
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/

  # The Cache/Store
  # cache:
