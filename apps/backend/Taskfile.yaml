version: '3'

vars:
  CHECKPOINT_DB_DSN:
    sh: |
      HOST=$(grep "^CHECKPOINT_DATABASE.HOST=" .env | cut -d'=' -f2 | tr -d '"')
      PORT=$(grep "^CHECKPOINT_DATABASE.PORT=" .env | cut -d'=' -f2 | tr -d '"')
      USER=$(grep "^CHECKPOINT_DATABASE.USER=" .env | cut -d'=' -f2 | tr -d '"')
      PASSWORD=$(grep "^CHECKPOINT_DATABASE.PASSWORD=" .env | cut -d'=' -f2 | tr -d '"')
      NAME=$(grep "^CHECKPOINT_DATABASE.NAME=" .env | cut -d'=' -f2 | tr -d '"')
      SSL_MODE=$(grep "^CHECKPOINT_DATABASE.SSL_MODE=" .env | cut -d'=' -f2 | tr -d '"')
      echo "postgres://${USER}:${PASSWORD}@${HOST}:${PORT}/${NAME}?sslmode=${SSL_MODE}"

tasks:
  help:
    desc: print this help message
    cmds:
    - task --list-all
    silent: true

  printDSN:
    desc: print db DSN
    cmds:
    - echo "{{.CHECKPOINT_DB_DSN}}"
    silent: true

  confirm:
    desc: confirmation prompt
    cmds:
    - |
      echo -n 'Are you sure? [y/N] ' && read ans && [ ${ans:-N} = y ]
    silent: true
    internal: true

  run:
    desc: run the checkpoint application
    cmds:
    - go run ./cmd/backend/main.go

  migrations:new:
    desc: create a new database migration
    vars:
      NAME: '{{.name | default ""}}'
    cmds:
    - |
      if [ -z "{{.NAME}}" ]; then
        echo "Error: name parameter is required"
        echo "Usage: task migrations:new name=migration_name"
        exit 1
      fi
    - echo 'Creating migration file for {{.NAME}}...'
    - tern new -m ./internal/database/migrations {{.NAME}}

  migrations:up:
    desc: apply all up database migrations
    deps: [ confirm ]
    cmds:
    - echo 'Running up migrations...'
    - tern migrate -m ./internal/database/migrations --conn-string {{.CHECKPOINT_DB_DSN}}

  tidy:
    desc: format all .go files, and tidy and vendor module dependencies
    cmds:
    - echo 'Formatting .go files...'
    - go fmt ./...
    - echo 'Tidying module dependencies...'
    - go mod tidy
    - echo 'Verifying dependencies...'
    - go mod verify

  lint:
    desc: run golangci-lint against the backend
    cmds:
    - golangci-lint run ./...
