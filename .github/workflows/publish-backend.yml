name: Publish Backend Image

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on master
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/master; then
            echo "::error::Tag ${{ github.ref_name }} does not point to a commit on master — refusing to publish."
            exit 1
          fi

      - name: Check for backend changes since previous tag
        id: check
        run: |
          previous_tag=$(git tag --sort=-creatordate --merged "${{ github.ref_name }}" | grep -v "^${{ github.ref_name }}$" | head -n1)
          if [ -z "$previous_tag" ]; then
            echo "No previous tag found — building unconditionally."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Comparing $previous_tag..${{ github.ref_name }} for apps/backend changes"
          if git diff --quiet "$previous_tag" "${{ github.ref_name }}" -- apps/backend; then
            echo "No backend changes since $previous_tag — skipping build."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        if: steps.check.outputs.changed == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: steps.check.outputs.changed == 'true'
        with:
          context: apps/backend
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/saivikrantg/checkpoint-backend:latest
            ghcr.io/saivikrantg/checkpoint-backend:${{ github.ref_name }}
